name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install "casadi>=3.6" "numpy>=1.24" "scipy>=1.10" "matplotlib>=3.7" pytest
      - name: Run the test suite
        run: PYTHONPATH= pytest -q
