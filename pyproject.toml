[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gntpf"
version = "0.1.0"
description = "Off-tracking-minimising path following for Generalised N-Trailer vehicles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nestor N. Deniz", email = "ndeniz@harper-adams.ac.uk" },
    { name = "Fernando Auat Cheein", email = "fauat@harper-adams.ac.uk" },
]
keywords = ["n-trailer", "model predictive control", "moving horizon estimation",
            "path following", "agricultural robotics"]
dependencies = [
    "casadi>=3.6",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["gntpf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A sourced ROS environment puts its site-packages on PYTHONPATH, and pytest then
# auto-loads ROS's launch_testing plugin, which needs PyYAML and fails inside a
# clean venv.  None of those plugins are wanted here.
addopts = "-p no:launch_testing -p no:launch_pytest -p no:launch_testing_ros"
